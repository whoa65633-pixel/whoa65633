<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science CTA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="menu-screen" class="screen active">
    <h1>SCIENCE CTA</h1>
    <button id="start-btn">START GAME</button>
  </div>

  <div id="game-screen" class="screen">

    <header>
      <div class="team-panel blue">
        <h2 id="team1-name">TEAM A</h2>
        <p id="team1-score">0</p>
      </div>

      <div class="game-info">
        <h2 id="question-counter">Question 1 / 79</h2>
        <h3 id="turn-indicator">TEAM A TURN</h3>
      </div>

      <div class="team-panel red">
        <h2 id="team2-name">TEAM B</h2>
        <p id="team2-score">0</p>
      </div>
    </header>

    <main>
      <div id="category">Biology</div>

      <div id="question-box">
        Loading Question...
      </div>

      <div id="answers-container">
      </div>
    </main>

    <footer>
      <button id="next-btn">NEXT QUESTION</button>
    </footer>

  </div>

  <div id="end-screen" class="screen">
    <h1>GAME OVER</h1>
    <h2 id="winner-text"></h2>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
